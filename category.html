<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>القسم | TahaSite</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="store.js"></script></head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">TahaSite</a><a class="btn ghost" href="admin.html#projects">الإدارة</a></div></header>
<main class="container"><div class="page-hero"><h1 id="t"></h1><p>البرامج في هذا القسم.</p></div><div class="list" id="list"></div></main>
<footer><div class="container footer-row"><span>© 2026 TahaSite</span></div></footer>
<script>
(async()=>{if(!await requireAdmin())return;
 const cat=new URLSearchParams(location.search).get('c')||'';
 document.getElementById('t').textContent=cat;document.title=cat+' | TahaSite';
 const{data}=await sb.from('projects').select('name,description').eq('category',cat);
 document.getElementById('list').innerHTML=(data||[]).map(p=>`<div class="list-item"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></div>`).join('')||'<p class="empty">مفيش برامج في القسم ده لسه.</p>';
})();
</script>
</body></html>
